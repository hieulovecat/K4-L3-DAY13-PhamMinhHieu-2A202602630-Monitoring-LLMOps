service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: Học viên phải giải thích hoặc điều chỉnh ngưỡng bằng baseline của mình. Ví dụ nếu có 10,000 request trong cửa sổ 28 ngày, error budget 0.5% nghĩa là tối đa 50 request được phép không đạt SLO.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
# --- Giải thích của học viên (Phạm Minh Hiếu - 2A202602630) ---
explanation:
  baseline: >-
    Khi prompt được cache, request bình thường mất khoảng 160-600 ms (retrieval gần 0 ms,
    generation khoảng 150 ms, TTFT khoảng 50 ms). Ngưỡng 3000 ms chừa đủ khoảng cho lúc
    Langfuse/network chậm, nhưng vẫn bắt được incident rag_slow (retrieval +2.5 s), vốn đẩy
    latency lên trên 2.6 s ngay cả khi phần còn lại bình thường.
  why_this_sli: >-
    Người dùng chỉ quan tâm câu trả lời có đến không và có nhanh không, nên good event là
    response_sent với latency_ms <= 3000; request lỗi (request_failed) và request chậm đều tính là bad.
  target_choice: >-
    Giữ 99.5% trong 28 ngày: đủ chặt với một chat API, nhưng vẫn chừa chỗ cho fake LLM,
    phụ thuộc Langfuse bên ngoài và các practice incident trong lab.
  error_budget_calculation: >-
    error_budget = 100% - 99.5% = 0.5% số request trong cửa sổ 28 ngày.
    Ví dụ 10,000 request thì được phép tối đa 50 request lỗi hoặc chậm hơn 3000 ms;
    100,000 request thì tối đa 500. Tốc độ đốt budget = bad_ratio / 0.005
    (ví dụ 5% request xấu trong 1 giờ nghĩa là đốt nhanh gấp 10 lần mức cho phép).
  budget_policy: >-
    Còn dưới 50% budget: dừng promote prompt/model mới, chỉ cho phép fix và rollback.
    Hết budget: freeze thay đổi cho tới khi SLI quay lại trên target.
